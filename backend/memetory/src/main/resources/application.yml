spring:
  profiles:
    group:
      "local": "local, jwt, config"
    active: local # "local" 을 실행

---
spring:
  active: dev # "dev" 을 실행

---
spring:
  config:
    activate:
      on-profile: "local"

  datasource:
    url: jdbc:mysql://localhost:3306/snowball
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  redis:
    host: "localhost"
    port: 6379
    refreshToken:
      expiration: 1209600

  ai-server:
    url: "http://localhost:5001/files"

  oauth2:
    google-url: "https://www.googleapis.com/oauth2/v2/userinfo"
    kakao-url: "https://kapi.kakao.com/v2/user/me"

  firebase:
    path: firebase/firebase_key.json


springdoc:
  swagger-ui:
    tags-sorter: alpha # 태그를 알파벳 순으로 정렬
    operations-sorter: method  # delete - get - patch - post - put 순으로 정렬, alpha를 사용하면 알파벳 순으로 정렬 가능

  paths-to-match:
    - /** # swagger-ui에 표시할 api의 엔드포인트 패턴

